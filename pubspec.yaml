name: supermarket_app
description: A basic supermarket Flutter app
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  flutter_riverpod: ^3.3.1
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  image_picker: ^1.2.2
  image: ^4.8.0
  # Keep these on the same FlutterFire line; newer storage 13.4.x fails
  # Android Kotlin compilation in this project.
  firebase_storage: 13.3.0
  firebase_messaging: 16.1.3
  flutter_local_notifications: ^21.0.0
  mobile_scanner: ^7.2.0
  firebase_app_check: ^0.4.3
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0
  cloud_functions: ^6.2.0
  sendotp_flutter_sdk: 0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/SLV_super_market.png
    - assets/gk_mart_logo.png
    - assets/home_supermarket_banner.png

# Native splash branding is disabled. The in-app SplashScreen is the single
# branded startup experience.

# APP ICON CONFIG
flutter_icons:
  android: true
  ios: true
  image_path: "assets/gk_mart_app_icon_1024.png"
